<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory in London · 纸上城市</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Full-window 3D reader: the book on a wooden desk, a slim bar of controls at the bottom, the story in a side card */
:root{
  --ink:#3a3129; --paper:#f6efe0; --paper-edge:#ddd0b4; --gold:#d8a93b; --red:#b8372f;
  --glass:rgba(28,20,14,.72); --glass-line:rgba(246,239,224,.14); --muted:#bfae95;
  --f-display:"Cormorant Garamond",Georgia,serif; --f-story:"Noto Serif SC","Songti SC",serif; --f-ui:"Noto Sans SC","PingFang SC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#171009;color:var(--paper);font-family:var(--f-ui);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(10,6,3,.55) 100%)}
button{font:inherit;color:inherit}
.pill{display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-line);border-radius:999px;padding:6px}
.ib{border:0;background:transparent;border-radius:999px;padding:.55em 1em;cursor:pointer;font-size:.88rem;color:var(--paper);white-space:nowrap}
.ib:hover{background:rgba(246,239,224,.1)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib.solid{background:var(--paper);color:var(--ink);font-weight:500}
.ib.solid:hover{background:#fff}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
header>*{pointer-events:auto}
.brand{font-family:var(--f-display);font-size:1.25rem;font-style:italic;letter-spacing:.02em;padding:0 .4em}
.brand small{font-style:normal;font-family:var(--f-ui);font-size:.72rem;color:var(--muted);letter-spacing:.12em;margin-left:.6em}
footer{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;max-width:calc(100% - 32px)}
.now{position:relative;display:flex;flex-direction:column;align-items:center;min-width:12em;padding:0 .6em;line-height:1.25}
.now b{font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.03em}
.now span{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
/* the page dots ride in the bar's bottom padding, so the bar is as narrow open as it is on the cover */
.dots{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);display:flex;justify-content:center;align-items:center;height:8px}
.dot{width:16px;height:16px;margin:-4px 0;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot::before{content:"";width:4px;height:4px;border-radius:50%;background:rgba(246,239,224,.4)}
.dot[aria-current="true"]::before{width:12px;border-radius:2px;background:var(--gold)}
.card{position:fixed;left:16px;bottom:max(16px,env(safe-area-inset-bottom));width:min(330px,calc(100% - 32px));background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--glass-line);border-radius:16px;padding:16px 18px 14px;transition:opacity .3s,transform .3s}
.card[hidden]{display:block!important;opacity:0;transform:translateY(10px);pointer-events:none}
.card .eyebrow{margin:0;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.card h2{margin:4px 0 0;font-family:var(--f-story);font-weight:600;font-size:1.25rem}
.card h2 small{display:block;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:.85em;color:var(--muted);margin-top:2px}
.card p{margin:10px 0 0;font-family:var(--f-story);font-size:.88rem;line-height:1.8;color:#eadfca}
.card ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:.82rem;line-height:1.55;color:#eadfca}
.card li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.card li::before{content:"";width:6px;height:6px;margin-top:.55em;border-radius:50%;background:var(--gold)}
.card .x{position:absolute;top:8px;right:8px;padding:.3em .6em}
.card .save{margin-top:12px;width:100%;border:1px solid rgba(216,169,59,.55);color:var(--gold)}
.card .save:hover{background:rgba(216,169,59,.12)}
.note{position:fixed;z-index:20;max-width:250px;background:var(--paper);color:var(--ink);font-family:var(--f-story);font-size:.9rem;line-height:1.6;padding:10px 14px;border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.5);pointer-events:none;transform:translate(-50%,calc(-100% - 16px));animation:pop .25s ease-out}
.note.dialogue{width:max-content;max-width:min(260px,calc(100vw - 24px));font-size:.92rem;font-weight:600;line-height:1.5;padding:8px 13px;border:1.5px solid #d8a93b;box-shadow:0 4px 16px rgba(30,18,10,.35)}
.note::after{content:"";position:absolute;left:var(--tail-x,50%);bottom:-7px;width:14px;height:14px;background:var(--paper);transform:translateX(-50%) rotate(45deg)}
@keyframes pop{from{opacity:0;transform:translate(-50%,calc(-100% - 6px))}}
.loading{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-story);color:var(--muted);letter-spacing:.1em}
.loading[hidden],.pill[hidden]{display:none}
.err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-family:var(--f-story);line-height:1.8}
.err[hidden]{display:none}
.err a{color:var(--gold)}
@media (max-width:760px){
  .card{bottom:auto;top:calc(max(14px,env(safe-area-inset-top)) + 54px)}
  .brand{display:none}
  header{left:12px;right:12px}
  header .pill{padding:4px;gap:2px}
  header .ib{padding:.5em .75em;font-size:.82rem}
  .long{display:none}
}
/* phones: the bottom bar keeps to time · place on one line */
@media (max-width: 600px) { #nowSub .stn { display: none; } #nowSub { white-space: nowrap; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="一本可以翻、可以拉的立体书"></canvas>
<div class="vignette"></div>

<header>
  <div class="pill"><a class="ib" href="index.html">‹ 书架</a><span class="brand">Memory in London<small>伦敦的一天</small></span></div>
  <div class="pill" id="tools" hidden><button class="ib" id="story" type="button" aria-pressed="false">本页介绍</button><button class="ib" id="closeBook" type="button" title="合上书，回到封面">回到封面</button></div>
</header>

<section class="card" id="card" hidden aria-live="polite">
  <button class="ib x" id="cardX" type="button" aria-label="收起">✕</button>
  <p class="eyebrow" id="eyebrow"></p>
  <h2 id="title"></h2>
  <p id="text"></p>
  <ul id="todo"></ul>
  <button class="ib save" id="savePage" type="button">保存这一页 ↓</button>
</section>

<footer>
  <div class="pill" id="bar">
    <button class="ib" id="prev" type="button" aria-label="上一页">‹</button>
    <div class="now"><b id="nowTitle">Memory in London</b><span id="nowSub">伦敦的一天</span><div class="dots" id="dots"></div></div>
    <button class="ib" id="next" type="button" aria-label="下一页">›</button>
    <button class="ib solid" id="openBook" type="button">翻开这本书</button>
  </div>
</footer>

<div class="loading" id="loading" hidden></div>
<div class="err" id="err" hidden><div>这台设备打不开 3D 立体书（需要 WebGL）。<br><a href="index.html">回到书架</a>看看其他书吧。</div></div>
<div id="noteLayer"></div>

<script type="importmap">{"imports": {"three": "./vendor/three/three.module.min.js"}}</script>
<script type="module">
import {createReader} from './books/book3d.js';
import {MEMORY_LONDON as BOOK} from './books/memory-london.js';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

let noteFrame, noteTimer, cardOpen = false, last = null, swipeHinted = false;
const ui = {
  note(text, x, y, options = {}) {
    const l = $('noteLayer'); l.innerHTML = ''; cancelAnimationFrame(noteFrame);
    const n = document.createElement('div'); n.className = 'note' + (options.anchor ? ' dialogue' : ''); n.textContent = text;
    n.setAttribute('role', 'status'); l.append(n);
    const place = () => {
      if (!n.isConnected) return;
      const [ax, ay] = options.anchor ? options.anchor() : [x, y];
      const half = n.offsetWidth / 2 + 12;
      const left = Math.max(half, Math.min(innerWidth - half, ax));
      n.style.left = left + 'px'; n.style.top = Math.max(n.offsetHeight + 24, ay) + 'px';
      n.style.setProperty('--tail-x', Math.max(18, Math.min(n.offsetWidth - 18, ax - left + n.offsetWidth / 2)) + 'px');
      if (options.anchor) noteFrame = requestAnimationFrame(place);
    };
    place(); clearTimeout(noteTimer); noteTimer = setTimeout(() => { n.remove(); cancelAnimationFrame(noteFrame); }, options.anchor ? 3000 : 3800);
  },
  loading(t) { $('loading').hidden = !t; $('loading').textContent = t || ''; },
  // how to read the book is printed on the title page, so there is no floating hint line
  hint() {},
  state(s) {
    if (last && last.cur !== s.cur) clearNote();
    last = s;
    if (s.open && !swipeHinted && matchMedia('(max-aspect-ratio: 85/100)').matches) {
      swipeHinted = true; setTimeout(() => ui.note('左右拖动可以看两边，双击放大。', innerWidth / 2, innerHeight * .62), 1600);
    }
    $('openBook').hidden = s.open; $('prev').hidden = $('next').hidden = !s.open; $('tools').hidden = !s.open;
    $('dots').innerHTML = '';
    if (s.open) {
      for (let i = 0; i < s.total; i++) {
        const d = document.createElement('button'); d.className = 'dot'; d.type = 'button';
        d.setAttribute('aria-label', '翻到 ' + BOOK.spreads[i].title); d.setAttribute('aria-current', i === s.cur);
        d.addEventListener('click', () => reader.go(i)); $('dots').append(d);
      }
      $('prev').disabled = false; $('next').disabled = s.cur >= s.total - 1;
      const sp = s.spread;
      $('nowTitle').textContent = sp.title; $('nowSub').innerHTML = esc(sp.eyebrow) + (sp.station ? `<span class="stn"> · ⊖ ${esc(sp.station)} 站</span>` : '');
      $('eyebrow').textContent = sp.eyebrow; $('title').innerHTML = `${esc(sp.title)}<small>${esc(sp.en)}</small>`;
      $('text').textContent = sp.story; $('todo').innerHTML = sp.todo.map(t => `<li>${esc(t)}</li>`).join('');
    } else {
      $('nowTitle').textContent = BOOK.title; $('nowSub').textContent = BOOK.subtitle; setCard(false);
    }
  },
};
function setCard(on) { cardOpen = on; $('card').hidden = !on; $('story').setAttribute('aria-pressed', on); }

let reader;
try {
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('no webgl');
  ui.loading('正在装订…');
  await Promise.race([
    Promise.all(['600 40px "Cormorant Garamond"', 'italic 400 34px "Cormorant Garamond"', '400 24px "Noto Serif SC"'].map(f => document.fonts.load(f, 'Aa伦敦'))),
    new Promise(r => setTimeout(r, 2500)),
  ]);
  reader = await createReader({canvas: $('scene'), book: BOOK, ui});
  ui.loading(null);
} catch (e) {
  console.error(e); ui.loading(null); $('err').hidden = false;
}
$('openBook').addEventListener('click', () => reader.open());
$('closeBook').addEventListener('click', () => reader.close());
$('prev').addEventListener('click', () => reader.prev());
$('next').addEventListener('click', () => reader.next());
// a new touch on the book dismisses the speech bubble, so it never sits on top of the next thing you want to tap
function clearNote() { clearTimeout(noteTimer); cancelAnimationFrame(noteFrame); $('noteLayer').innerHTML = ''; }
$('scene').addEventListener('pointerdown', clearNote);
$('story').addEventListener('click', () => last && last.open && setCard(!cardOpen));
$('cardX').addEventListener('click', () => setCard(false));
/* "保存这一页": a share card in the same style as the popup-page skill — a close-up polaroid of the page's signature
   piece above, the whole open spread below, on paper, with the page's names and a postmark. 1080 × 1440 at 2×. */
async function shareCard() {
  const i = reader.cur, sp = BOOK.spreads[i]; if (i < 0) return null;
  // the close-up: the page's own camera for the card (shareView: az, pol, r, and a target point or a piece to focus on)
  // if it has one, else its signature piece close in
  const sv = sp.shareView, focus = sv ? sv.focus || null : sp.signature || (i === 0 ? 'file' : null);
  const wide = reader.snapshot({w: 1600, h: 900}), close = reader.snapshot({w: 1200, h: 760, focus, view: sv || (focus ? {} : {az: 24, pol: 40, r: .62})});
  if (!wide || !close) return null;
  const W = 1080, H = 1440, k = 2, c = document.createElement('canvas'); c.width = W * k; c.height = H * k;
  const x = c.getContext('2d'); x.scale(k, k);
  const SERIF = '"Cormorant Garamond", Georgia, serif', SC = '"Noto Serif SC", "Songti SC", serif';
  // paper, with a soft light and a double frame
  x.fillStyle = '#f3ead8'; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(W * .2, H * .1, 0, W * .2, H * .1, W); g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#b9a37a'; x.lineWidth = 2; x.strokeRect(22, 22, W - 44, H - 44); x.strokeStyle = '#d6c4a0'; x.lineWidth = 1; x.strokeRect(31, 31, W - 62, H - 62);
  const text = (t, X, Y, font, color, align = 'left', ls = 0) => { x.font = font; x.fillStyle = color; x.textAlign = align; if ('letterSpacing' in x) x.letterSpacing = ls + 'px'; x.fillText(t, X, Y); if ('letterSpacing' in x) x.letterSpacing = '0px'; };
  text(`MEMORY IN LONDON  ·  ${i ? `STOP ${i} / ${BOOK.spreads.length - 1}` : 'THE ROUTE'}`, W / 2, 62, `600 20px ${SERIF}`, '#8a6d48', 'center', 6);
  // the polaroid: the signature piece close up, taped on at a slant
  const PW = W - 230, PH = Math.round(H * .3);
  x.save(); x.translate(76 + PW / 2, 104 + PH / 2); x.rotate(-2.2 * Math.PI / 180);
  x.shadowColor = 'rgba(60,40,20,.22)'; x.shadowBlur = 24; x.shadowOffsetY = 10; x.fillStyle = '#fffdf8'; x.fillRect(-PW / 2, -PH / 2, PW, PH + 32); x.shadowColor = 'transparent';
  const iw = PW - 28, ih = PH - 28, sc = Math.max(iw / close.width, ih / close.height);
  x.save(); x.beginPath(); x.rect(-PW / 2 + 14, -PH / 2 + 14, iw, ih); x.clip();
  x.drawImage(close, -PW / 2 + 14 + (iw - close.width * sc) / 2, -PH / 2 + 14 + (ih - close.height * sc) / 2, close.width * sc, close.height * sc); x.restore();
  text(sp.eyebrow, -PW / 2 + 18, PH / 2 + 18, `italic 600 22px ${SERIF}`, '#6d5a44');
  x.fillStyle = 'rgba(214,190,140,.65)';
  x.save(); x.translate(-PW / 2 + 100, -PH / 2 - 2); x.rotate(-.1); x.fillRect(-60, -17, 120, 34); x.restore();
  x.save(); x.translate(PW / 2 - 100, -PH / 2 - 2); x.rotate(.09); x.fillRect(-60, -17, 120, 34); x.restore();
  x.restore();
  // the hand-written arrow
  const ay = PH + 140;
  text('翻开，它就立起来了', W - 92, ay, `500 22px ${SC}`, '#9a3a2e', 'right');
  x.strokeStyle = '#9a3a2e'; x.lineWidth = 3; x.lineCap = 'round'; x.setLineDash([7, 6]);
  x.beginPath(); x.moveTo(W - 102, ay + 12); x.bezierCurveTo(W - 112, ay + 48, W - 152, ay + 60, W - 194, ay + 64); x.stroke(); x.setLineDash([]);
  x.beginPath(); x.moveTo(W - 182, ay + 54); x.lineTo(W - 196, ay + 65); x.lineTo(W - 180, ay + 72); x.stroke();
  // the whole spread in a white frame
  const fy = PH + 218, fw = W - 100, fh = Math.round(fw * 9 / 16);
  x.shadowColor = 'rgba(40,25,10,.3)'; x.shadowBlur = 30; x.shadowOffsetY = 14; x.fillStyle = '#fffdf8'; x.fillRect(50, fy, fw, fh); x.shadowColor = 'transparent';
  x.drawImage(wide, 60, fy + 10, fw - 20, fh - 20);
  // names: English, Chinese, the first sentence of the story
  const ty = fy + fh + 70;
  text(sp.en, 70, ty, `italic 600 54px ${SERIF}`, '#2e2218');
  text(`${sp.title}${sp.station ? `  ·  ${sp.station} 站` : ''}`, 70, ty + 44, `600 26px ${SC}`, '#4a3826');
  // the story's first sentence in at most two lines, kept inside the frame: a line never starts with a comma or full
  // stop (punctuation stays on the line before), and a longer sentence ends the second line with an ellipsis
  const first = (sp.story.match(/^[^。！]*[。！]/) || [sp.story])[0], maxW = W - 330, rows = [];
  x.font = `400 20px ${SC}`;
  let line = '';
  for (const ch of first) { if (x.measureText(line + ch).width > maxW && !'，。、；：！？）》」'.includes(ch)) { rows.push(line); line = ''; } line += ch; }
  if (line) rows.push(line);
  if (rows.length > 2) { let r = rows[1].replace(/[，。、；：！？]+$/, ''); while (x.measureText(r + '…').width > maxW) r = r.slice(0, -1); rows.splice(1, rows.length - 1, r + '…'); }
  rows.forEach((r, k) => text(r, 70, ty + 84 + k * 30, `400 20px ${SC}`, '#6d5a44'));
  // the postmark
  x.save(); x.translate(W - 126, H - 120); x.rotate(8 * Math.PI / 180); x.strokeStyle = '#9a3a2e'; x.lineWidth = 2; x.setLineDash([6, 5]);
  x.beginPath(); x.arc(0, 0, 56, 0, Math.PI * 2); x.stroke(); x.setLineDash([]);
  text('POP-UP', 0, -16, `600 15px ${SERIF}`, '#9a3a2e', 'center', 2); text('LONDON', 0, 6, `600 15px ${SERIF}`, '#9a3a2e', 'center', 2);
  text(i ? `№ 0${i}` : 'ROUTE', 0, 28, `600 15px ${SERIF}`, '#9a3a2e', 'center', 2); x.restore();
  return c;
}
async function savePage() {
  const btn = $('savePage'); if (btn.disabled) return;
  btn.disabled = true; const label = btn.textContent; btn.textContent = '正在生成…';
  try {
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));
    const c = await shareCard(); if (!c) throw new Error('not ready');
    const blob = await new Promise(r => c.toBlob(r, 'image/png')), name = `memory-in-london-${reader.cur}.png`;
    const file = new File([blob], name, {type: 'image/png'});
    // phones: the share sheet (save to photos, send to Xiaohongshu…); elsewhere a download
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({files: [file]})) {
      await navigator.share({files: [file], title: 'Memory in London'}).catch(() => {});
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    btn.textContent = '已保存 ✓';
  } catch (e) { console.error(e); btn.textContent = '翻页时不能保存，稍后再试'; }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 1800);
}
$('savePage').addEventListener('click', savePage);
window.__shareCard = shareCard;
window.__reader = reader;
</script>
</body>
</html>
